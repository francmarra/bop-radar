name: api

on:
  push:
    paths: ['api/**', 'site/data/**', 'web/src/api/schema.d.ts', 'web/package*.json', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'site/data/**', 'web/src/api/schema.d.ts', 'web/package*.json', '.github/workflows/api.yml']
  # Data commits made with GITHUB_TOKEN do not trigger push workflows.
  workflow_run:
    workflows: ["Update BoP data and deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  api:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: test the freshly committed data on the default branch head
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || '' }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore api
      - run: dotnet build api --no-restore -warnaserror
      - run: dotnet test api --no-build
      - run: docker build api
      # The committed web/src/api/schema.d.ts must match what the API publishes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Check web API types are up to date
        run: |
          ConnectionStrings__Default="Host=localhost;Database=none;Username=x;Password=x" \
            dotnet run --no-build --project api/src/BopRadar.Api --urls http://localhost:8080 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/openapi/v1.json >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/openapi/v1.json > /dev/null || { echo "::error::API did not start"; exit 1; }
          cd web
          npx openapi-typescript http://localhost:8080/openapi/v1.json -o "$RUNNER_TEMP/schema.d.ts"
          diff -u src/api/schema.d.ts "$RUNNER_TEMP/schema.d.ts" || { echo "::error::web/src/api/schema.d.ts is out of date; run 'npm run gen:api' in web/"; exit 1; }
