name: api

on:
  push:
    paths: ['api/**', 'site/data/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'site/data/**', '.github/workflows/api.yml']
  # Data commits made with GITHUB_TOKEN do not trigger push workflows.
  workflow_run:
    workflows: ["Update BoP data and deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  api:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: test the freshly committed data on the default branch head
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || '' }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore api
      - run: dotnet build api --no-restore -warnaserror
      - run: dotnet test api --no-build
      - run: docker build api
