name: Update BoP data and deploy

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
    - cron: "0 6 * * 4"  # Thursdays 06:00 UTC: next week's Daily Races appear mid-week
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: cache
          key: gt-engine-${{ github.run_id }}
          restore-keys: gt-engine-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint and test
        run: |
          uv run ruff check src tests
          uv run --extra render pytest -q
          node --test "tests/js/*.test.mjs"
      - name: Fetch and rebuild
        if: github.event_name != 'push'
        run: |
          cp -r site/data "$RUNNER_TEMP/prev-data"
          uv run gt7bop leaderboards --pages 2
          uv run gt7bop update --refresh
          uv run gt7bop week
      # errors stop here, before bad data is committed or deployed; warnings deploy and raise an alert
      - name: Check data
        id: check
        run: |
          args=()
          if [ "${{ github.event_name }}" != push ]; then args=(--baseline "$RUNNER_TEMP/prev-data" --max-age 2); fi
          status=0
          uv run gt7bop check "${args[@]}" > "$RUNNER_TEMP/check.txt" || status=$?
          cat "$RUNNER_TEMP/check.txt"
          { echo "report<<CHECK_EOF"; grep -E '^(error|warning):' "$RUNNER_TEMP/check.txt" || true; echo CHECK_EOF; } >> "$GITHUB_OUTPUT"
          exit $status
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/leaderboards
          git diff --cached --quiet || git commit -m "data: BoP update $(date -u +%F)" && git push
      - name: Build site (pre-rendered pages, sitemap, share images)
        run: uv run --extra render gt7bop render --out dist --goatcounter "${{ vars.GOATCOUNTER }}"  # repo variable; empty = no analytics
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # one open issue while something is wrong (GitHub emails the owner), closed by the next healthy run
  alert:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      REPORT: ${{ needs.build.outputs.report }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          open=$(gh issue list --label action-alert --state open --json number --jq '.[0].number // empty')
          if [ "$FAILED" = true ] || [ -n "$REPORT" ]; then
            if [ "$FAILED" = true ]; then what="failed: the live site was not updated"; else what="deployed with warnings"; fi
            body=$(printf 'Run %s (%s) %s.\n\n```\n%s\n```\n' "$RUN_URL" "${{ github.event_name }}" "$what" "${REPORT:-see the run log}")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh label create action-alert --color d73a4a --description "Scheduled update problem" --force
              gh issue create --title "Data update needs attention" --label action-alert --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Healthy again: $RUN_URL"
          fi
