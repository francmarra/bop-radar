name: Update BoP data and deploy

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
    - cron: "0 6 * * 4"  # Thursdays 06:00 UTC: next week's Daily Races appear mid-week
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: cache
          key: gt-engine-${{ github.run_id }}
          restore-keys: gt-engine-
      - run: uv run pytest -q
      - name: Fetch and rebuild
        if: github.event_name != 'push'
        run: |
          uv run gt7bop leaderboards --pages 2
          uv run gt7bop update --refresh
          uv run gt7bop week
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/leaderboards
          git diff --cached --quiet || git commit -m "data: BoP update $(date -u +%F)" && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
