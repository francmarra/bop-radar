[project]
name = "bop-radar"
version = "0.1.0"
description = "Gran Turismo 7 Balance of Performance tracker for Gr.1-4 cars"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gt7bop = "gt7bop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gt7bop"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
